services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Os valores vêm de interpolação, não de um `env_file:` apontando para um
    # .env literal. O Coolify (e outras PaaS) injetam as variáveis gerenciadas
    # no contexto de interpolação do compose, mas não necessariamente escrevem
    # um .env no diretório do projeto — com `env_file: .env` o container subia
    # sem configuração nenhuma. Localmente o `docker compose` lê ./.env para
    # interpolação sozinho, então isto funciona nos dois lugares.
    environment:
      NODE_ENV: production
      PORT: 6555
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      # Montada a partir da senha, que é a única coisa que muda entre ambientes.
      # `:?` faz o `docker compose` parar na hora dizendo qual variável falta,
      # em vez de subir um container que morre depois. Use uma senha só com
      # letras e números (openssl rand -hex 24): ela entra numa URL, e um `@`
      # ou `/` no meio a quebraria.
      DATABASE_URL: postgres://dudaplan:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD (gere com openssl rand -hex 24)}@db:5432/dudaplan
      # Domínios extras de onde as Server Actions podem ser chamadas. Só é
      # necessário se o proxy não repassar X-Forwarded-Host — ver next.config.ts.
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
      # Se definido, a tela de cadastro exige este código. Vazio = cadastro aberto.
      APP_SIGNUP_CODE: ${APP_SIGNUP_CODE:-}
      # Mantém as referências das Server Actions válidas entre builds. Sem uma
      # chave estável o Next gera uma nova a cada build, e toda aba aberta passa
      # a falhar com "Failed to find Server Action" depois de um redeploy.
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    # `expose` além de `ports`: o Coolify descobre por aqui para qual porta
    # rotear o domínio. Só com `ports`, publicar na porta do host ainda pode
    # colidir com outro serviço na mesma máquina.
    expose:
      - "6555"
    ports:
      - "6555:6555"
    # Áudios das reuniões, que ficam em disco e não no banco — sem este volume,
    # cada redeploy apaga as gravações.
    volumes:
      - uploads:/app/data
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:6555/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Postgres local. Sem `ports:` de propósito: só o app, pela rede interna do
  # compose, alcança o banco — ele não fica exposto na internet da VPS.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dudaplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD (gere com openssl rand -hex 24)}
      POSTGRES_DB: dudaplan
    volumes:
      - pgdata:/var/lib/postgresql/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dudaplan -d dudaplan"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  uploads: {}
  pgdata: {}
