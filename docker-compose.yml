services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Os valores vêm de interpolação, não de um `env_file:` apontando para um
    # .env literal. O Coolify (e outras PaaS) injetam as variáveis gerenciadas
    # no contexto de interpolação do compose, mas não necessariamente escrevem
    # um .env no diretório do projeto — com `env_file: .env` o container subia
    # sem configuração nenhuma. Localmente o `docker compose` lê ./.env para
    # interpolação sozinho, então isto funciona nos dois lugares.
    environment:
      NODE_ENV: production
      PORT: 6555
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      # Conexão com o Postgres por variáveis PG*, que o driver lê sozinho. Não
      # uso uma URL de propósito: a senha entraria nela, e um caractere como `@`,
      # `/` ou `#` numa senha gerada a quebraria. Aqui qualquer senha serve.
      #
      # `SERVICE_PASSWORD_POSTGRES` é uma variável "mágica" do Coolify: no
      # primeiro deploy ele gera uma senha aleatória, guarda em Environment
      # Variables e reaproveita nos deploys seguintes. O mesmo nome nos dois
      # serviços (app e db) devolve o mesmo valor. Fora do Coolify, defina-a no
      # .env.
      PGHOST: db
      PGPORT: 5432
      PGUSER: dudaplan
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      PGDATABASE: dudaplan
      # Domínios extras de onde as Server Actions podem ser chamadas. Só é
      # necessário se o proxy não repassar X-Forwarded-Host — ver next.config.ts.
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
      # Código de convite do cadastro. `SERVICE_PASSWORD_SIGNUP` é outra variável
      # mágica do Coolify: ele gera um valor aleatório no primeiro deploy e o
      # mostra em Environment Variables (é lá que você o lê, e pode trocá-lo por
      # uma frase sua). Fora do Coolify fica vazio = cadastro aberto.
      APP_SIGNUP_CODE: ${SERVICE_PASSWORD_SIGNUP:-}
      # Mantém as referências das Server Actions válidas entre builds e
      # redeploys; sem chave estável, toda aba aberta falha com "Failed to find
      # Server Action" depois de um deploy. O Next exige base64 de 16/24/32
      # bytes, então o docker-entrypoint.sh deriva a chave desta semente (gerada
      # pelo Coolify, estável entre deploys). Para usar uma chave sua, defina
      # NEXT_SERVER_ACTIONS_ENCRYPTION_KEY — ela tem prioridade.
      ACTIONS_KEY_SEED: ${SERVICE_PASSWORD_64_ACTIONSKEY:-}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    # `expose` além de `ports`: o Coolify descobre por aqui para qual porta
    # rotear o domínio. Só com `ports`, publicar na porta do host ainda pode
    # colidir com outro serviço na mesma máquina.
    expose:
      - "6555"
    ports:
      - "6555:6555"
    # Áudios das reuniões, que ficam em disco e não no banco — sem este volume,
    # cada redeploy apaga as gravações.
    volumes:
      - uploads:/app/data
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:6555/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Postgres local. Sem `ports:` de propósito: só o app, pela rede interna do
  # compose, alcança o banco — ele não fica exposto na internet da VPS.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dudaplan
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: dudaplan
    volumes:
      - pgdata:/var/lib/postgresql/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dudaplan -d dudaplan"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  uploads: {}
  pgdata: {}
