services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Os valores vêm de interpolação, não de um `env_file:` apontando para um
    # .env literal. O Coolify (e outras PaaS) injetam as variáveis gerenciadas
    # no contexto de interpolação do compose, mas não necessariamente escrevem
    # um .env no diretório do projeto — com `env_file: .env` o container subia
    # sem configuração nenhuma. Localmente o `docker compose` lê ./.env para
    # interpolação sozinho, então isto funciona nos dois lugares.
    environment:
      NODE_ENV: production
      PORT: 6555
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-transcribe}
      OPENAI_ANALYSIS_MODEL: ${OPENAI_ANALYSIS_MODEL:-gpt-4o-mini}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    ports:
      - "6555:6555"
    # O banco agora é o Supabase, então não há serviço `db` nem volume de dados
    # aqui. Este volume guarda só os áudios de reunião, que ainda ficam em disco
    # — sem ele, cada redeploy apaga as gravações.
    volumes:
      - uploads:/app/data
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:6555/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  uploads: {}
