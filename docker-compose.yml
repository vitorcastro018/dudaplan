services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dudaplan}
      # Deliberately has no default. Postgres only applies this on the very
      # first start, while the data directory is still empty — so a default
      # here silently bakes a throwaway password into the volume, and every
      # later change to it appears to do nothing while the app fails with
      # "authentication failed". Failing to start is the clearer outcome.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD (deve ser igual a senha usada em DATABASE_URL)}
      POSTGRES_DB: ${POSTGRES_DB:-dudaplan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dudaplan} -d ${POSTGRES_DB:-dudaplan}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Values come from interpolation, not from an `env_file:` pointing at a
    # literal .env. Coolify (and other PaaS) inject managed variables into the
    # compose interpolation context but do not necessarily write a .env file
    # into the project directory, so `env_file: .env` silently yielded a
    # container with no configuration at all. Locally, `docker compose` reads
    # ./.env for interpolation automatically, so this works both places.
    environment:
      NODE_ENV: production
      PORT: 6555
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      APP_PASSWORD: ${APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-transcribe}
      OPENAI_ANALYSIS_MODEL: ${OPENAI_ANALYSIS_MODEL:-gpt-4o-mini}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "6555:6555"
    volumes:
      - uploads:/app/data
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:6555/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pgdata: {}
  uploads: {}
